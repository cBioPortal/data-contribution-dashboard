# Baseline security headers, included from every location block in default.conf.
#
# It lives in a snippet because nginx inherits add_header directives from an
# outer level only when the inner level declares none of its own. Every location
# that sets a Cache-Control or Content-Type header therefore has to re-include
# this file, or it is served with no security headers whatsoever — which is what
# used to happen to the app document itself, since SPA routes are internally
# redirected into `location = /index.html`.
#
# SAMEORIGIN rather than DENY: Keycloak restores a session by loading
# /silent-check-sso.html in a hidden iframe on this very origin, and DENY refuses
# same-origin framing too. That silently broke session persistence on every
# reload — the iframe never rendered, so it never posted the result back, the
# adapter hung until its timeout and the mirrored token was cleared as "not
# logged in". Logging in still worked, because that is a top-level redirect
# rather than an iframe. Against the threat this header actually addresses,
# third-party framing, SAMEORIGIN and DENY are equivalent here.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
