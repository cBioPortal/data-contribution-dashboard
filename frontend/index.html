<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>cBioPortal Data Contribution Dashboard</title>
    <link rel="icon" type="image/svg+xml" href="/cBioportalLogo2024-mark.svg" />
    <meta name="description" content="Track and manage cancer genomics data contributions to cBioPortal." />

    <meta property="og:title" content="cBioPortal Data Contribution Dashboard" />
    <meta property="og:description" content="Track and manage cancer genomics data contributions to cBioPortal." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/images/cbioportal-logo.png" />

    <meta name="twitter:card" content="summary_large_image" />

    <!-- Runtime configuration, rewritten from container env vars on startup.
         Must load before the app bundle so window.__ENV__ exists. See src/config.ts. -->
    <script src="/config.js"></script>
  </head>

  <body>
    <!--
      App shell shown while the bundle downloads and parses and Keycloak resolves.
      main.tsx renders inside initKeycloak().finally(), so nothing painted until
      that whole chain finished — around two seconds in production, of which the
      user saw a blank white page.

      This lives in the document rather than in React so it appears as soon as the
      HTML lands, before any JavaScript runs. Styles are inline for the same
      reason: the CSS bundle has not loaded yet either. createRoot().render()
      replaces these children on first paint, so there is nothing to clean up.
    -->
    <div id="root">
      <div id="app-boot" style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#fff;font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;">
        <div class="app-boot-spinner" style="height:48px;width:48px;border-radius:9999px;border:4px solid #3b82f6;border-right-color:transparent;"></div>
        <p style="margin:0;color:#4b5563;font-size:15px;">Loading dashboard&hellip;</p>
      </div>
    </div>
    <style>
      @keyframes app-boot-spin { to { transform: rotate(360deg); } }
      .app-boot-spinner { animation: app-boot-spin 0.8s linear infinite; }
      @media (prefers-reduced-motion: reduce) {
        .app-boot-spinner { animation-duration: 2.4s; }
      }
    </style>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
