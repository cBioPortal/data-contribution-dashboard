server {
    # nginx-unprivileged runs as a non-root user, so it cannot bind :80.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Baseline hardening. `always` so they are also emitted on error responses.
    # The SPA is self-contained apart from the Keycloak endpoints it calls, so a
    # restrictive default-src is workable; connect-src stays open because the API
    # and Keycloak hosts are configured per environment at runtime (config.js).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Probe target — cheap and unlogged.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Rewritten from the environment on every container start, so it must never
    # be cached — a stale copy would point the app at the wrong API host.
    location = /config.js {
        add_header Cache-Control "no-store";
    }

    # The entry document names the content-hashed bundles, so caching it would
    # pin clients to a previous deploy.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Vite content-hashes everything under /assets, so these are immutable.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA client-side routing: unknown paths render the app, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
