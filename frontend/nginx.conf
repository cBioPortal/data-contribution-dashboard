server {
    # nginx-unprivileged runs as a non-root user, so it cannot bind :80.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Baseline hardening. `always` so they are also emitted on error responses.
    #
    # Every location that declares an add_header of its own must re-include this,
    # because nginx inherits add_header from an outer level only when the inner
    # level declares none — see nginx-security-headers.conf.
    include /etc/nginx/snippets/security-headers.conf;

    # Probe target — cheap and unlogged.
    location = /healthz {
        access_log off;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Rewritten from the environment on every container start, so it must never
    # be cached — a stale copy would point the app at the wrong API host.
    location = /config.js {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store";
    }

    # The entry document names the content-hashed bundles, so caching it would
    # pin clients to a previous deploy. SPA routes land here too, via the
    # try_files below, so this is the block that serves the app to every visitor.
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store";
    }

    # Vite content-hashes everything under /assets, so these are immutable.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA client-side routing: unknown paths render the app, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
