name: Build and Push Docker Images

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to build and tag the image (branch, tag, or commit SHA)'
        type: string
        required: true

env:
  REGISTRY_IMAGE: cbioportal/curation-dashboard

jobs:
  docker-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            context: ./backend
          - component: frontend
            context: ./frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Set image tag
        run: |
          if [ -n "${{ github.event.inputs.ref }}" ]; then
            RAW_TAG="${{ github.event.inputs.ref }}"
          else
            RAW_TAG="latest"
          fi
          # Refs like feature/foo are not valid Docker tags — flatten the slashes.
          echo "IMAGE_TAG=$(echo "$RAW_TAG" | tr '/' '-')" >> "$GITHUB_ENV"
          echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          # Per-component cache scope so the two builds don't evict each other.
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
          # Both images share one DockerHub repo, distinguished by tag suffix.
          # The immutable SHA tag is what k8s Deployments should reference —
          # rollouts against a moving `latest` don't reliably restart pods.
          tags: |
            ${{ env.REGISTRY_IMAGE }}:${{ env.IMAGE_TAG }}-${{ matrix.component }}
            ${{ env.REGISTRY_IMAGE }}:${{ env.SHORT_SHA }}-${{ matrix.component }}
